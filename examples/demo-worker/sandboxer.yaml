# The demo project: a Cloudflare Worker on D1.
#
# The cheapest thing sandboxer can run, and the fixture the end-to-end check uses.
# A D1 database is a file, so there is no server to install, no dump to restore,
# no version skew and no advisory lock — the whole database layer is a copy.

project: demo
sandboxer: ">=0.1.0"

database:
  driver: d1
  seed_from:
    # No `file:` here on purpose. A fresh checkout has no `.wrangler/state`, so
    # this sandbox starts from an empty database, runs the project's own
    # migrations, and then applies these fixtures.
    fixtures: seeds/fixtures.sql
  migrate:
    # wrangler resolves wrangler.jsonc from the working directory, so it has to run
    # in the project root rather than the isolated empty directory used by default.
    workdir: .
    # The project's own runner, never reimplemented. `--persist-to` is what points
    # wrangler at the sandbox's state directory instead of the worktree
    # (contracts §5.4).
    command: npx wrangler d1 migrations apply demo --local --persist-to "$SANDBOXER_D1_DIR"
  # A D1 database admits one writer, so exactly one service may open it.
  owner: app

# No backends. The worker *is* the app, which is the third runtime kind: a
# long-running dev server, proxied on its own hostname.
frontends:
  apps:
    - label: app
      package: .
      # `--var` and not the `env:` block below: inside a Worker, `env` is
      # wrangler's bindings, never the process environment. The sandbox exports
      # SANDBOXER_SLUG to the container either way, and `env.SANDBOXER_SLUG` in
      # src/index.js read `undefined` until this flag existed -- so every
      # sandbox called itself "local" and the page could not say which one had
      # served it.
      serve: >-
        npx wrangler dev --port 8787 --ip 127.0.0.1
        --persist-to "$SANDBOXER_D1_DIR"
        --var SANDBOXER_SLUG:"$SANDBOXER_SLUG"
      port: 8787
      health: /health

deps:
  root: .

toolchain:
  node: "22"

access:
  apps: public
  controls: password

# The sandbox computes where things are and exports them under a SANDBOXER_ prefix;
# a project reads its own names for the same things. This is the join between the
# two, and it is why nothing here can point at a real service.
#
# The demo needs no renaming -- it reads the engine's own names -- so the block
# carries one plain setting. The slug reaches the *Worker* through `--var` on
# the serve command above, because a Worker's `env` is wrangler's bindings and
# not the environment the process was started with.
env:
  WRANGLER_SEND_METRICS: "false"
