<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32" role="img" aria-label="The sandboxr mark">
  <title>The sandboxr mark</title>
  <!--
    The mark, at the 32-unit construction the favicon and the home-screen icons
    share: a flat brand-filled rounded square, radius 8.6 of 32, with three bars
    reversed out of it in white. The fill is the light half of the `tide` brand,
    which is the half an icon uses in both themes — see docs/brand.md.
  -->
  <rect width="32" height="32" rx="8.6" fill="#0b5f5a"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path d="M8 11h16"/>
    <path d="M8 16h10"/>
    <path d="M8 21h13"/>
  </g>
</svg>
