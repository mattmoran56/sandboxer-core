<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="sandboxr">
  <title>sandboxr</title>
  <!--
    The lockup both headers draw — the dashboard's and this site's — at twice
    their size: a 28px mark, a 10px gap, and the wordmark at 20px. Every number
    below is doubled from those.

    The wordmark is live text rather than outlines, so it is set in whatever the
    reader has. `Instrument Serif` is the product's display face and the first
    name in the stack; Georgia and Times New Roman are the fallbacks, and both
    are old-style serifs of roughly the same colour on the page. A renderer with
    none of the three gets its own serif. See docs/brand.md for when that
    matters, and use the header's own lockup wherever the font is guaranteed.
  -->
  <style>
    .sbx-word {
      font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
      font-size: 40px;
      fill: #0e1a1c;
    }
    /*
      The wordmark is `ink`, which is near-black in light and near-white in dark.
      An SVG loaded as an image carries its own document and its own media
      queries, and that is the only way this file can follow the reader's theme
      on GitHub, where it is served as a file rather than inlined into the page.
    */
    @media (prefers-color-scheme: dark) {
      .sbx-word { fill: #e6eeec; }
    }
  </style>
  <g transform="translate(0 4)">
    <rect width="56" height="56" rx="15.05" fill="#0b5f5a"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.55" stroke-linecap="round">
      <path d="M14 19.25h28"/>
      <path d="M14 28h17.5"/>
      <path d="M14 36.75h22.75"/>
    </g>
  </g>
  <text class="sbx-word" x="76" y="46">sandboxr</text>
</svg>
