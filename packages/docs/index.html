<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      An empty icon, on purpose: the engine has no logo, and without this line
      every page load asks the static host for a `/favicon.ico` that is not there.
    -->
    <link rel="icon" href="data:," />
    <!--
      The stored theme, applied before the first paint.

      Inline and blocking on purpose. The prerendered HTML is real markup that the
      browser paints before any module has run, so an effect that set the theme
      after hydration would show a frame of the default light page to everybody who
      chose dark — on every navigation that reloads. This is the one thing in the
      site that has to happen ahead of the bundle.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("sandboxer.docs.prefs.v1");
          var prefs = raw ? JSON.parse(raw) : {};
          var choice = prefs && prefs.theme;
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          root.dataset.theme = choice === "light" || choice === "dark" ? choice : dark ? "dark" : "light";
        } catch (error) {
          // A browser with site data blocked throws on `localStorage` itself. The
          // stylesheet's own defaults are then what everybody gets, which is fine.
        }
      })();
    </script>
    <!--
      The shell's title, and only the shell's.

      `build/prerender.mjs` strips this element before it substitutes the
      per-page `<head>` below, because a document with two `<title>`s keeps the
      *first* — leaving this one in place gave every prerendered page the title
      "sandboxer documentation" with the correct tag sitting inert a few lines
      down. So this is the dev-server and pre-hydration fallback; the real
      per-page title comes from `src/lib/head.ts`. Renaming this element means
      changing that regex too.
    -->
    <title>sandboxer documentation</title>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
